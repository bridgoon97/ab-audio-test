[project]
name = "ab-audio-test"
version = "0.1.0"
description = "轻量级 A/B 音频主观测试（双盲听音打分）工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pyside6>=6.10.3",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]
